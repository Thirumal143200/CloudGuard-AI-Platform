name: CloudGuard AI Platform — Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Stage 1-5: Backend Validation & Testing
  backend-ci:
    name: "Backend: Dependencies, Lint, Security & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Stage 2: Install Backend Dependencies"
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Stage 3: Backend Syntax & Lint Check"
        run: |
          cd backend
          python -m compileall app/
          python -m compileall tests/

      - name: "Stage 4 & 5: Backend Unit & Integration Tests"
        env:
          ENVIRONMENT: "development"
          DEPLOYMENT_MODE: "DEMO"
          JWT_SECRET_KEY: "test-jwt-secret-key-entropy-must-be-32-bytes"
          JWT_REFRESH_SECRET_KEY: "test-jwt-refresh-secret-key-must-be-32b"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          cd backend
          pytest -v

  # Stage 6-8: Frontend Validation & Production Build
  frontend-ci:
    name: "Frontend: Dependencies, Lint & Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: "Stage 6: Install Frontend Dependencies"
        run: |
          cd frontend
          npm ci || npm install

      - name: "Stage 7 & 8: Compile Production Bundle"
        env:
          VITE_API_URL: "/api/v1"
        run: |
          cd frontend
          npm run build

  # Stage 9: Secret & Credential Scanning Gate
  secret-scan:
    name: "Stage 9: Secret Scanning & Credential Leak Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verify .env Excluded from Git"
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "CRITICAL: .env file is tracked in git index! Aborting pipeline."
            exit 1
          fi
          echo ".env is safely untracked."

      - name: "Scan for Hardcoded Cloud API Keys"
        run: |
          # Explicitly scan source files and fixtures while excluding only build/runtime artifacts
          if grep -rnE "AKIA[0-9A-Z]{16}" --exclude-dir={.git,node_modules,venv,__pycache__} . ; then
            echo "CRITICAL: Potential AWS Access Key detected in repository! Aborting."
            exit 1
          fi
          echo "Secret scan passed with zero exposed credentials."

  # Stage 10: Container Build Verification
  docker-build:
    name: "Stage 10: Container Image Build Gate"
    needs: [backend-ci, frontend-ci, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Build Backend Docker Image"
        run: |
          docker build -t cloudguard-backend:latest ./backend

      - name: "Build Frontend Docker Image"
        run: |
          docker build -t cloudguard-frontend:latest ./frontend

  # Stage 11 & 12: Automated Deployment & Smoke Test
  smoke-test:
    name: "Stage 11 & 12: Production Deployment Smoke Test"
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Start Docker Compose Environment"
        run: |
          docker compose up -d

      - name: "Wait for Health Probe"
        run: |
          for i in {1..15}; do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Backend health probe responsive!"
              break
            fi
            echo "Waiting for container startup... ($i/15)"
            sleep 2
          done

      - name: "Verify Health & Readiness Probes"
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/health/live
          curl -f http://localhost:8000/health/ready
          curl -f http://localhost:8000/api/system/status

      - name: "Teardown Containers"
        if: always()
        run: |
          docker compose down
