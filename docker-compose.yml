version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cloudguard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CloudGuard2026Secure!}
      POSTGRES_DB: ${POSTGRES_DB:-cloudguard_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudguard-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=CloudGuard AI Enterprise Platform
      - ENVIRONMENT=development
      - DEPLOYMENT_MODE=DEMO
      - DATABASE_URL=postgresql://cloudguard:CloudGuard2026Secure!@db:5432/cloudguard_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cloudguard-prod-hackathon-2026-secret-key-32b}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-cloudguard-refresh-hackathon-2026-32b}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: cloudguard-frontend
    ports:
      - "5173:80"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
